<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugar — 100 Mexicanos Dijeron</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg" style="background: linear-gradient(90deg, #006847 0%, #FFFFFF 50%, #CE1126 100%);">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="#">100 Mexicanos Dijeron</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-dark fw-semibold" sec:authentication="name"></span>
                <a th:href="@{/dashboard}" class="btn btn-outline-dark btn-sm">Volver</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="team-card team-1 mb-3">
                    <h3>Equipo 1</h3>
                    <div class="score-display" th:text="${game.team1Score}">0</div>
                    <div class="mt-2">
                        <small>Errores:</small>
                        <span th:text="${game.team1Errors} + '/3'">0/3</span>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="text-center py-3">
                    <h5>Partida <span th:text="${game.id}">#</span></h5>
                    <span class="badge bg-warning text-dark" th:text="${game.status}">status</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="team-card team-2 mb-3">
                    <h3>Equipo 2</h3>
                    <div class="score-display" th:text="${game.team2Score}">0</div>
                    <div class="mt-2">
                        <small>Errores:</small>
                        <span th:text="${game.team2Errors} + '/1'">0/1</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body text-center py-5">
                        <div class="alert alert-info">
                            <h4>Pantalla de juego</h4>
                            <p class="mb-0">La interfaz completa del juego se implementará en la Fase 4.</p>
                            <p class="mb-0">Usa la API REST para interactuar con la partida.</p>
                        </div>
                        <hr>
                        <div class="mt-3">
                            <a th:href="@{/api/games/__${game.id}__/rounds/start}" class="btn btn-primary me-2">Iniciar Ronda</a>
                            <a th:href="@{/api/games/__${game.id}__/results}" class="btn btn-info">Resultados</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
