<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Jugar — Partida #' + ${game.id} + ' — 100 Mexicanos Dijeron'">Jugar — 100 Mexicanos Dijeron</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
</head>
<body>

<div x-data="gameBoard()" x-init="init()" class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg" style="background: linear-gradient(90deg, #006847 0%, #FFFFFF 50%, #CE1126 100%);">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="#">100 Mexicanos Dijeron</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 fw-semibold" sec:authentication="name"></span>
                <a th:href="@{/dashboard}" class="btn btn-outline-dark btn-sm">Salir</a>
            </div>
        </div>
    </nav>

    <!-- Scores -->
    <div class="container mt-3">
        <div class="row g-2">
            <div class="col-5">
                <div class="team-card team-1" :class="{ 'opacity-75': turn !== 'TURN_PLAYER1' }">
                    <h4 class="mb-1">Equipo 1</h4>
                    <div class="score-display" x-text="team1Score">0</div>
                    <div class="mt-1">
                        <span class="badge bg-light text-dark" x-text="'Errores: ' + team1Errors + '/3'">0/3</span>
                    </div>
                </div>
            </div>
            <div class="col-2 d-flex align-items-center justify-content-center">
                <div class="text-center">
                    <div class="fs-1 fw-bold" style="color: #006847;">VS</div>
                    <div class="badge bg-warning text-dark mt-1" x-text="status"></div>
                </div>
            </div>
            <div class="col-5">
                <div class="team-card team-2" :class="{ 'opacity-75': turn !== 'TURN_PLAYER2' }">
                    <h4 class="mb-1">Equipo 2</h4>
                    <div class="score-display" x-text="team2Score">0</div>
                    <div class="mt-1">
                        <span class="badge bg-light text-dark" x-text="'Errores: ' + team2Errors + '/1'">0/1</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Current turn indicator -->
    <div class="container mt-2">
        <div class="alert text-center fw-bold py-2 mb-0"
             :class="turn === 'TURN_PLAYER1' ? 'alert-success' : (turn === 'TURN_PLAYER2' ? 'alert-danger' : 'alert-secondary')">
            <span x-text="turnMessage" class="fs-5"></span>
        </div>
    </div>

    <!-- Question area -->
    <div class="container mt-3 flex-grow-1">
        <div class="card shadow game-board">
            <div class="card-body text-center">

                <!-- No game started -->
                <div x-show="!currentQuestion" class="py-5">
                    <h3 class="mb-4">¡Bienvenidos a 100 Mexicanos Dijeron!</h3>
                    <p class="text-muted mb-4">Presiona "Iniciar Ronda" para comenzar</p>
                    <button class="btn btn-success btn-lg" @click="startRound" :disabled="loading">
                        Iniciar Ronda
                    </button>
                </div>

                <!-- Question display -->
                <div x-show="currentQuestion" x-cloak>
                    <div class="question-text mb-4" x-text="currentQuestion.questionText"></div>

                    <!-- Answers -->
                    <div class="row justify-content-center">
                        <div class="col-md-8">
                            <template x-for="(answer, index) in revealedAnswers" :key="answer.id">
                                <div class="answer-btn reveal"
                                     :style="'animation-delay: ' + (index * 0.3) + 's'">
                                    <span x-text="answer.text"></span>
                                    <span class="score" x-text="answer.score + ' pts'"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Answer input (for submitting answers) -->
                    <div x-show="!roundFinished" class="mt-4">
                        <div class="row justify-content-center">
                            <div class="col-md-6">
                                <div class="input-group input-group-lg">
                                    <input type="text" class="form-control" x-model="answerText"
                                           placeholder="Escribe tu respuesta..." @keyup.enter="submitAnswer"
                                           :disabled="loading">
                                    <button class="btn btn-primary" @click="submitAnswer" :disabled="loading">
                                        <span x-show="!loading">Responder</span>
                                        <span x-show="loading">Enviando...</span>
                                    </button>
                                </div>
                                <div x-show="lastResult" class="mt-2 alert py-2"
                                     :class="lastResult.correct ? 'alert-success' : 'alert-danger'"
                                     x-text="lastResult.message">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom controls -->
    <div class="container mt-3 mb-4">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <button class="btn btn-success me-2" @click="startRound" :disabled="loading || !roundFinished">
                    Siguiente Ronda
                </button>
                <button class="btn btn-danger me-2" @click="endRound" :disabled="loading || roundFinished">
                    Terminar Ronda
                </button>
                <button class="btn btn-info" @click="getResults" :disabled="loading">
                    Resultados
                </button>
            </div>
        </div>
        <div x-show="showResults" x-cloak class="row justify-content-center mt-3">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center">
                        <h4 class="mb-0">Resultados Finales</h4>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-around text-center">
                            <div>
                                <h5 style="color: #006847;">Equipo 1</h5>
                                <span class="fs-2 fw-bold" x-text="team1Score"></span>
                            </div>
                            <div>
                                <h5 class="text-muted">VS</h5>
                                <span class="fs-4" x-text="winner"></span>
                            </div>
                            <div>
                                <h5 style="color: #CE1126;">Equipo 2</h5>
                                <span class="fs-2 fw-bold" x-text="team2Score"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>[x-cloak] { display: none !important; }</style>

<script>
function gameBoard() {
    return {
        gameId: [[${game.id}]],
        team1Score: [[${game.team1Score}]],
        team2Score: [[${game.team2Score}]],
        team1Errors: [[${game.team1Errors}]],
        team2Errors: [[${game.team2Errors}]],
        status: '[[${game.status}]]',
        turn: '[[${game.currentRoundStatus}]]',

        currentQuestion: null,
        revealedAnswers: [],
        answerText: '',
        loading: false,
        roundFinished: false,
        lastResult: null,
        showResults: false,
        winner: '',
        stompClient: null,

        get turnMessage() {
            if (this.turn === 'TURN_PLAYER1') return 'Turno del Equipo 1';
            if (this.turn === 'TURN_PLAYER2') return 'Turno del Equipo 2';
            if (this.turn === 'FINISHED' || this.status === 'FINISHED') return 'Ronda terminada';
            return 'Esperando...';
        },

        init() {
            this.connectWebSocket();
            if (this.turn === 'TURN_PLAYER1' || this.turn === 'TURN_PLAYER2') {
                this.loadCurrentQuestion();
            }
        },

        connectWebSocket() {
            const socket = new SockJS('/ws');
            this.stompClient = Stomp.over(socket);
            this.stompClient.connect({}, () => {
                this.stompClient.subscribe('/topic/game/' + this.gameId, (message) => {
                    const update = JSON.parse(message.body);
                    this.team1Score = update.game.team1Score;
                    this.team2Score = update.game.team2Score;
                    this.team1Errors = update.game.team1Errors;
                    this.team2Errors = update.game.team2Errors;
                    this.status = update.game.status;
                    this.turn = update.game.currentRoundStatus;
                });
            });
        },

        async startRound() {
            this.loading = true;
            this.showResults = false;
            this.revealedAnswers = [];
            this.currentQuestion = null;
            this.lastResult = null;
            try {
                const res = await fetch('/api/games/' + this.gameId + '/rounds/start', { method: 'POST' });
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.message);
                    this.loading = false;
                    return;
                }
                const game = await res.json();
                this.updateGameState(game);
                await this.loadCurrentQuestion();
            } catch (e) {
                alert('Error al iniciar ronda: ' + e.message);
            }
            this.loading = false;
        },

        async loadCurrentQuestion() {
            try {
                const gameRes = await fetch('/api/games/' + this.gameId);
                const game = await gameRes.json();
                if (game.currentQuestionId) {
                    const res = await fetch('/api/games/' + this.gameId + '/rounds/start');
                    // The question is loaded via the game state
                }
                this.updateGameState(game);
            } catch (e) {
                console.error('Error loading question:', e);
            }
        },

        async submitAnswer() {
            if (!this.answerText.trim()) return;
            this.loading = true;
            this.lastResult = null;
            try {
                const res = await fetch('/api/games/' + this.gameId + '/rounds/answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        participantId: 1, // TODO: seleccionar participante real
                        gameQuestionId: this.currentQuestion?.id || 1,
                        answerText: this.answerText.trim(),
                        roundMultiplier: 1
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    this.answerText = '';
                    // Refresh game state
                    const gameRes = await fetch('/api/games/' + this.gameId);
                    const game = await gameRes.json();
                    this.updateGameState(game);
                } else {
                    const err = await res.json();
                    this.lastResult = { correct: false, message: 'Error: ' + err.message };
                }
            } catch (e) {
                this.lastResult = { correct: false, message: 'Error de conexión' };
            }
            this.loading = false;
        },

        async endRound() {
            this.loading = true;
            try {
                const res = await fetch('/api/games/' + this.gameId + '/rounds/end', { method: 'POST' });
                if (res.ok) {
                    const game = await res.json();
                    this.updateGameState(game);
                    this.roundFinished = true;
                    this.currentQuestion = null;
                }
            } catch (e) {
                alert('Error: ' + e.message);
            }
            this.loading = false;
        },

        async getResults() {
            this.loading = true;
            this.showResults = true;
            try {
                const res = await fetch('/api/games/' + this.gameId + '/results');
                const data = await res.json();
                this.team1Score = data.team1Score;
                this.team2Score = data.team2Score;
                this.winner = data.winner === 'team1' ? 'Gana Equipo 1' : (data.winner === 'team2' ? 'Gana Equipo 2' : 'Empate');
            } catch (e) {
                alert('Error: ' + e.message);
            }
            this.loading = false;
        },

        updateGameState(game) {
            this.team1Score = game.team1Score;
            this.team2Score = game.team2Score;
            this.team1Errors = game.team1Errors;
            this.team2Errors = game.team2Errors;
            this.status = game.status;
            this.turn = game.currentRoundStatus;
        }
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
