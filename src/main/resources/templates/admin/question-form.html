<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${question.id != null} ? 'Editar Pregunta' : 'Nueva Pregunta'">Admin — 100 Mexicanos Dijeron</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg" style="background: linear-gradient(90deg, #006847 0%, #FFFFFF 50%, #CE1126 100%);">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="#">100 Mexicanos Dijeron — Admin</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-dark fw-semibold" sec:authentication="name"></span>
                <a th:href="@{/admin/questions}" class="btn btn-outline-dark btn-sm me-2">Volver</a>
                <a th:href="@{/logout}" class="btn btn-outline-dark btn-sm">Salir</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4" x-data="answerForm()" x-init="initAnswers()">
        <h1 th:text="${question.id != null} ? 'Editar Pregunta' : 'Nueva Pregunta'" class="mb-4"></h1>

        <div class="card">
            <div class="card-body">
                <form th:action="${question.id != null} ? @{/admin/questions/{id}/edit(id=${question.id})} : @{/admin/questions/create}"
                      th:object="${question}" method="post">
                    <div class="mb-3">
                        <label for="text" class="form-label">Pregunta</label>
                        <input type="text" id="text" th:field="*{text}" class="form-control" required maxlength="500">
                    </div>

                    <hr>
                    <h5 class="mb-3">Respuestas</h5>

                    <div id="answers-container">
                        <template x-for="(answer, index) in answers" :key="index">
                            <div class="row mb-2 align-items-center">
                                <div class="col-6">
                                    <input type="text" class="form-control" :name="'answers[' + index + '].text'"
                                           x-model="answer.text" placeholder="Respuesta" required>
                                </div>
                                <div class="col-3">
                                    <input type="number" class="form-control" :name="'answers[' + index + '].score'"
                                           x-model="answer.score" placeholder="Puntaje" min="1" max="100" required>
                                </div>
                                <div class="col-3">
                                    <button type="button" class="btn btn-danger btn-sm" @click="removeAnswer(index)"
                                            x-show="answers.length > 1">Eliminar</button>
                                </div>
                            </div>
                        </template>
                    </div>

                    <button type="button" class="btn btn-outline-success btn-sm mt-2" @click="addAnswer()">
                        + Agregar Respuesta
                    </button>

                    <hr>
                    <button type="submit" class="btn btn-success"
                            th:text="${question.id != null} ? 'Guardar Cambios' : 'Crear Pregunta'">Guardar</button>
                    <a th:href="@{/admin/questions}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>

    <script>
    function answerForm() {
        return {
            answers: [],
            initAnswers() {
                const existing = [[${question.answers}]];
                if (existing && existing.length > 0) {
                    this.answers = existing.map(a => ({ text: a.text || '', score: a.score || 0 }));
                } else {
                    this.answers = [{ text: '', score: 10 }, { text: '', score: 5 }];
                }
            },
            addAnswer() {
                this.answers.push({ text: '', score: 1 });
            },
            removeAnswer(index) {
                this.answers.splice(index, 1);
            }
        }
    }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
