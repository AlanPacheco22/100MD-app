<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — 100 Mexicanos Dijeron</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg" style="background: linear-gradient(90deg, #006847 0%, #FFFFFF 50%, #CE1126 100%);">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="#">100 Mexicanos Dijeron — Admin</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-dark fw-semibold" sec:authentication="name"></span>
                <a th:href="@{/dashboard}" class="btn btn-outline-dark btn-sm me-2">Dashboard</a>
                <a th:href="@{/logout}" class="btn btn-outline-dark btn-sm">Salir</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-2">
                <div class="list-group">
                    <a th:href="@{/admin/questions}" class="list-group-item list-group-item-action">Preguntas</a>
                </div>
            </div>
            <div class="col-md-10">
                <th:block th:replace="${content}"/>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
