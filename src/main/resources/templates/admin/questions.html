<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Preguntas — 100 Mexicanos Dijeron</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg" style="background: linear-gradient(90deg, #006847 0%, #FFFFFF 50%, #CE1126 100%);">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="#">100 Mexicanos Dijeron — Admin</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-dark fw-semibold" sec:authentication="name"></span>
                <a th:href="@{/dashboard}" class="btn btn-outline-dark btn-sm me-2">Dashboard</a>
                <a th:href="@{/logout}" class="btn btn-outline-dark btn-sm">Salir</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Preguntas</h1>
            <a th:href="@{/admin/questions/create}" class="btn btn-success">Nueva Pregunta</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${questions.empty}" class="text-center py-5">
                    <p class="text-muted fs-5">No hay preguntas registradas.</p>
                    <a th:href="@{/admin/questions/create}" class="btn btn-success">Crear Primera Pregunta</a>
                </div>
                <div th:if="${!questions.empty}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Pregunta</th>
                                <th>Respuestas</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="q : ${questions}">
                                <td th:text="${q.id}"></td>
                                <td th:text="${q.text}"></td>
                                <td th:text="${q.answers != null ? q.answers.size() : 0}"></td>
                                <td>
                                    <a th:href="@{'/admin/questions/' + ${q.id} + '/edit'}" class="btn btn-sm btn-primary">Editar</a>
                                    <form th:action="@{'/admin/questions/' + ${q.id} + '/delete'}" method="post" style="display:inline;" onsubmit="return confirm('¿Eliminar esta pregunta?')">
                                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
