<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial — 100 Mexicanos Dijeron</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">100 MEXICANOS DIJERON</a>
            <div class="d-flex align-items-center gap-3">
                <span class="navbar-text text-secondary fw-semibold" sec:authentication="name"></span>
                <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm me-1">Dashboard</a>
                <a th:href="@{/logout}" class="btn btn-outline-secondary btn-sm">Salir</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4 fw-bold" style="font-family: 'Orbitron', sans-serif;">HISTORIAL</h1>

        <div class="card">
            <div class="card-body">
                <div th:if="${games.empty}" class="text-center py-5">
                    <p class="text-muted fs-5">No hay partidas registradas.</p>
                </div>
                <div th:if="${!games.empty}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                                <th class="text-center" style="color: #006847;">Equipo 1</th>
                                <th class="text-center" style="color: #CE1126;">Equipo 2</th>
                                <th>Ganador</th>
                                <th>Rondas</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="game : ${games}">
                                <td th:text="${game.id}"></td>
                                <td th:text="${#temporals.format(game.date, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <span th:text="${game.status}" class="badge"
                                          th:classappend="${game.status == 'FINISHED'} ? 'bg-secondary' : (${game.status == 'IN_PROGRESS'} ? 'bg-success' : 'bg-warning text-dark')"></span>
                                </td>
                                <td class="text-center fw-bold" style="color: #006847;" th:text="${game.team1Score}"></td>
                                <td class="text-center fw-bold" style="color: #CE1126;" th:text="${game.team2Score}"></td>
                                <td th:text="${game.winner}"></td>
                                <td class="text-center" th:text="${game.totalRounds}"></td>
                                <td>
                                    <a th:href="@{'/jugar/' + ${game.id}}" class="btn btn-sm btn-primary">Ver</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
